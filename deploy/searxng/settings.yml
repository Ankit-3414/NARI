# SearXNG settings

use_default_settings: true

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "nari_searxng_secret_key_change_me" # Change this for production
  base_url: http://localhost:8080/
  image_proxy: true

search:
  safe_search: 0
  autocomplete: "duckduckgo"
  formats:
    - html
    - json

engines:
  - name: google
    engine: google
    shortcut: g
  
  - name: bing
    engine: bing
    shortcut: b

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg

  - name: brave
    engine: brave
    shortcut: br

  - name: wikipedia
    engine: wikipedia
    shortcut: w

ui:
  static_use_hash: true
  theme: simple
