[project]
name = "nari-backend"
version = "0.1.0"
description = "NARI self-hosted productivity backend"
readme = "../NARI_Architecture.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "apscheduler>=3.11.2",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "python-dateutil>=2.9.0",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.32.0",
    "openai>=1.0.0",
    "cryptography>=42.0.0",
    "sentence-transformers>=3.0.0",
    "sqlite-vec>=0.1.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
